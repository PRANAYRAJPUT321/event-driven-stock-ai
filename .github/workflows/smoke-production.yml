# Temporary: checks the deployed site from a cloud runner, because the
# development sandbox cannot reach vercel.app. Read-only against production.
name: smoke-production
on:
  workflow_dispatch:
  push:
    branches: [claude/event-driven-stock-ai-tj6oic]
    paths: [scripts/smoke-news.mjs, scripts/smoke-audit.mjs, scripts/smoke-production.mjs, scripts/smoke-production-ui.mjs, scripts/smoke-post-checks.mjs, .github/workflows/smoke-production.yml]
permissions:
  contents: read
  checks: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect real headlines
        continue-on-error: true
        run: node scripts/smoke-news.mjs
      - name: Install browser driver
        run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright-core@1.48.2 sharp@0.33.5 >/dev/null
      - name: Audit (analysis answers and page timing)
        continue-on-error: true
        run: |
          cp "$GITHUB_WORKSPACE/scripts/smoke-audit.mjs" /tmp/pw/audit.mjs
          cd /tmp/pw && node audit.mjs
          mkdir -p "$GITHUB_WORKSPACE/smoke-out" && cp -r /tmp/pw/smoke-out/* "$GITHUB_WORKSPACE/smoke-out/"
      - name: Endpoints
        run: node scripts/smoke-production.mjs
        env:
          WAIT_FOR_DEPLOY: '1'
      - name: Pages in Chrome
        run: |
          cp "$GITHUB_WORKSPACE/scripts/smoke-production-ui.mjs" /tmp/pw/ui.mjs
          cd /tmp/pw && THUMBS=markets-dark,markets-light,markets-mobile,stock-reliance-1y,stock-reliance-1d,stock-reliance-candles,stock-hdfcbank-light,stock-tmpv-mobile,search-palette,analyze-anonymous,discover,login node ui.mjs
          cp -r /tmp/pw/smoke-out/* "$GITHUB_WORKSPACE/smoke-out/"
      - name: Post report and thumbnails as check runs
        if: always()
        run: node scripts/smoke-post-checks.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-out
          path: smoke-out
          retention-days: 3
